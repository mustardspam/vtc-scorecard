name: Weekly Digest Email

on:
  schedule:
    # Every Monday at 8:00 AM US Central (13:00 UTC during CDT / summer).
    # NOTE: GitHub Actions cron is always UTC and does NOT follow daylight saving.
    # During CST (winter) this fires at 7:00 AM Central; bump to '0 14 * * 1' if you
    # want a true 8:00 AM year-round during standard time.
    - cron: '0 13 * * 1'
  workflow_dispatch: # Allow manual trigger from GitHub Actions UI

jobs:
  send-digest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Send digest email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUPABASE_URL: https://jwsajxjpaapcpieutrdi.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node send-digest.js
